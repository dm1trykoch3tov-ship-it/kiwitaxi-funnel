function health(h){if(!h)return;var lv=h.level,tx=h.text;
  if(h.ts){var age=Math.max(0,Math.round((Date.now()-h.ts)/60000)),t=new Date(h.ts+3*3600e3),hm=('0'+t.getUTCHours()).slice(-2)+':'+('0'+t.getUTCMinutes()).slice(-2);

function goalsCard(){var g=S().goals,m=B.an&&B.an.month&&B.an.month.kpi;if(!m)return '';
  var now=Date.now(),d=new Date(now+MSKMS),ms=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)-MSKMS,dim=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate(),el=Math.max(1,(now-ms)/864e5),mon=MN[d.getUTCMonth()];

  var carriers=Object.keys(bc).map(function(k){var l=bc[k].sort(function(a,b){return b.ts-a.ts}),first={},cs={};
    l.forEach(function(x){if(x.h!=null&&x.h<=168&&(first[x.t]==null||x.h<first[x.t]))first[x.t]=x.h;cs[x.c+(x.reg!=='—'?' · '+x.reg:'')]=1});
    var mh=med(Object.keys(first).map(function(t){return first[t]})),o=stat(l);
    o.em=k;o.sig=(l.filter(function(x){return x.who&&x.who.length>2})[0]||{}).who||'';o.ph=(l.filter(function(x){return x.ph})[0]||{}).ph||'';
    o.countries=Object.keys(cs).slice(0,6);o.medH=mh==null?null:Math.round(mh*10)/10;o.lastD=l[0].d;o.lastTs=l[0].ts;o.last=l.slice(0,6).map(card);return o}).sort(function(a,b){return b.n-a.n||b.lastTs-a.lastTs});
  return {regions:regions,carriers:carriers}}
function renderPr(){var P0=B.prices||{},q=PRQ.trim().toLowerCase(),rr=perRange('pr'),P=P0.rows?prGroup(P0.rows.filter(function(x){return inR(rr,x.ts)})):{regions:P0.regions||[],carriers:P0.carriers||[]};P.total=P0.rows?P0.rows.filter(function(x){return inR(rr,x.ts)}).length:P0.total;P.fx=P0.fx;
  var h=perBar('pr')+'<div class="seg"><a data-m="reg" class="'+(PRM==='reg'?'on':'')+'">Регионы · '+P.regions.length+'</a><a data-m="car" class="'+(PRM==='car'?'on':'')+'">Перевозчики · '+P.carriers.length+'</a></div>';
  h+='<input id="q" placeholder="'+(PRM==='reg'?'Поиск: страна или город':'Поиск: почта, страна')+'" value="'+esc(PRQ)+'">';
  if(PRM==='reg'){var L=P.regions.filter(function(r){return !q||(r.c+' '+r.reg).toLowerCase().indexOf(q)>=0});
    L.forEach(function(r){var key='r'+r.c+'|'+r.reg,op=PRO===key;
      h+='<div class="pc" data-k="'+esc(key)+'"><div class="t"><div><div class="nm">'+esc(r.reg!=='—'?r.reg:r.c)+'</div><div class="sub">'+esc(r.reg!=='—'?(r.c&&r.c!=='—'?r.c:'страна не указана'):'город не указан')+'</div></div>'+prPrice(r)+'</div>'+prTags(r);
      h+=op?'<div class="open">'+r.last.map(function(x){return repRow(x,r.med)}).join('')+'</div>':'<div class="more2">Ответы перевозчиков ›</div>';h+='</div>'});
    if(!L.length)h+='<div class="card"><div class="empty">Ничего не найдено'+(rr?' за этот период':'')+'</div></div>'}
  else{var C=P.carriers.filter(function(c){return !q||(c.name+' '+c.em+' '+c.sig+' '+c.countries.join(' ')).toLowerCase().indexOf(q)>=0});
    C.forEach(function(c){var key='c'+c.em,op=PRO===key;
      h+='<div class="pc" data-k="'+esc(key)+'"><div class="t"><div style="min-width:0"><div class="nm em">'+esc(c.em)+'</div><div class="sub">'+esc(c.countries.map(function(x){return String(x).replace(/^—\s*·\s*/,'')}).filter(function(x){return x&&x!=='—'}).join(' · ')||'страна не указана')+(c.lastD?'<br>последний ответ '+esc(c.lastD):'')+'</div></div>'+prPrice(c)+'</div>'+prTags(c);
      if(op){h+='<div class="ct2"><a href="mailto:'+esc(c.em)+'">'+esc(c.em)+'</a>'+(c.ph?'<a href="tel:'+esc(c.ph.replace(/[^\d+]/g,''))+'">'+esc(c.ph)+'</a>':'')+'</div>'+(c.sig?'<div class="sub" style="margin-top:8px">Подпись: '+esc(c.sig)+'</div>':'')+'<div class="open">'+c.last.map(function(x){return repRow(x,c.med)}).join('')+'</div>'}
      else h+='<div class="more2">Контакты и ответы ›</div>';
      h+='</div>'});
    if(!C.length)h+='<div class="card"><div class="empty">Перевозчиков с почтой '+(rr?'за этот период ':'')+'нет</div></div>'}
  h+='<div class="note" style="padding:2px 4px 10px">Из листа «Ответы перевозчиков» ('+(P.total||0)+' ответов). Перевозчик определяется по почте — ответы без почты есть только в регионах. Цены и валюту скрипт берёт из текста письма — бывают ошибки (например, местная валюта без пометки); перед оффером сверяйся с письмом. Пересчёт в евро: '+esc(P.fx||'')+'.</div>';
  $('#v').innerHTML=h;
  document.querySelectorAll('.seg a[data-m]').forEach(function(a){a.onclick=function(){PRM=a.dataset.m;PRO='';PRQ='';render()}});
  document.querySelectorAll('.pc[data-k]').forEach(function(e){e.onclick=function(ev){if(ev.target.closest('a'))return;PRO=PRO===e.dataset.k?'':e.dataset.k;renderPr()}});
  liveQ(function(v){PRQ=v},renderPr);bindPer('pr',function(){PRO='';renderPr()});
}
function renderDay(d){
  var h=seg()+'<div class="chips">'+d.dates.map(function(x,i){return '<a class="chip'+(i===DAY?' on':'')+'" data-i="'+i+'">'+esc(x)+'</a>'}).join('')+'</div>';

}
var EVC={'новая заявка':'g','оплата':'g','поездка выполнена':'g','оффер':'','отмена':'r','ошибка загрузки':'r','смена статуса':'o'};
function evRow(r){var c=EVC[r.e];return '<div class="row"><div class="t">'+esc(r.t)+'</div><div class="m"><div class="n">'+esc(r.b||r.id)+'</div><div class="d">'+(r.f?esc(r.f)+': ':'')+(r.was?esc(r.was)+' → ':'')+esc(r.now||'')+'</div></div><span class="tag'+(c?' '+c:'')+'">'+esc(r.e)+'</span></div>'}
var LF=[['all','Все'],['new','Новые'],['offer','Офферы'],['pay','Оплаты'],['cancel','Отмены'],['status','Статусы'],['err','Ошибки']];
var LFN={new:function(r){return r.e==='новая заявка'},offer:function(r){return r.e==='оффер'},pay:function(r){return r.e==='оплата'||r.e==='поездка выполнена'},cancel:function(r){return r.e==='отмена'},status:function(r){return r.e==='смена статуса'},err:function(r){return r.e==='ошибка загрузки'}};
function lts(r){var m=/^(\d\d)\.(\d\d)\.(\d{4})/.exec(r.day||''),n=/(\d\d?):(\d\d)/.exec(r.t||'');return m?Date.UTC(+m[3],m[2]-1,+m[1],n?+n[1]:0,n?+n[2]:0)-MSKMS:null}
function logData(){var rr=perRange('log'),rows=(B.log||[]).filter(function(r){return inR(rr,lts(r))});if(LFN[LOGF])rows=rows.filter(LFN[LOGF]);var q=LOGQ.trim().toLowerCase();if(q)rows=rows.filter(function(r){return (r.id+' '+r.b+' '+r.was+' '+r.now).toLowerCase().indexOf(q)>=0});return{total:rows.length,rows:rows}}
function renderLog(){var d=logData();
  var h=seg()+perBar('log')+'<div class="chips">'+LF.map(function(x){return '<a class="chip'+(x[0]===LOGF?' on':'')+'" data-f="'+x[0]+'">'+x[1]+'</a>'}).join('')+'</div>';
  h+='<input id="q" placeholder="Поиск: заявка, тикет, город" value="'+esc(LOGQ)+'">';

  var days={},list=d.rows.slice(0,LOGN),out='';
  list.forEach(function(r){if(!days[r.day]){days[r.day]=1;out+='<div style="font-size:12px;font-weight:600;color:var(--p);padding:10px 0 2px">'+esc(r.day)+'</div>'}out+=evRow(r)});
  h+=list.length?'<div class="list">'+out+'</div>':'<div class="empty">Ничего не найдено</div>';
  if(d.rows.length>LOGN)h+='<a class="more" id="more">Показать ещё</a>';

}
