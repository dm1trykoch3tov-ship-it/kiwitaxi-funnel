<!doctype html><html><head><meta charset="utf-8"><title>Воронка · Kiwitaxi</title><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#5A2EC0;--p2:#6A3FD6;--ink:#1E1631;--mute:#5E5675;--bg:#F6F3FB;--card:#FDFCFF;--line:#E2DAF2;--tint:#EDE7F8;--acc:#F2A93B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#5A2EC0,#7B4FE0);color:#fff;padding:16px 16px 14px;border-radius:0 0 22px 22px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center}
h1{font-family:Manrope,Arial,sans-serif;font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
.sub{font-size:12px;opacity:.85;margin-top:1px}
.health{margin-top:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.3}
.dot{width:9px;height:9px;border-radius:50%;background:#7CE0A6;flex:none}.dot.warn{background:var(--acc)}.dot.bad{background:#FF8A80}
main{padding:14px 14px 92px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ct{font-family:Manrope,Arial,sans-serif;font-weight:800;font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ct small{font-family:Inter,Arial,sans-serif;font-weight:500;color:var(--mute);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--tint);border-radius:14px;padding:10px 10px 9px}
.kpi b{display:block;font-family:Manrope,Arial,sans-serif;font-size:24px;color:var(--p);line-height:1.1;font-weight:800}
.kpi span{font-size:12px;color:var(--mute)}
.kpi.o{background:#FDF0DC}.kpi.o b{color:#B06A0B}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:14px;padding:12px 10px;font-weight:600;cursor:pointer}
.b1{background:var(--p);color:#fff}.b2{background:var(--card);color:var(--p);border:1px solid var(--line)}
button:disabled{opacity:.55}
.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.list .row:first-child{border-top:0;padding-top:2px}
.row .t{color:var(--mute);font-size:12px;min-width:42px;padding-top:2px}
.row .m{flex:1;min-width:0}.row .n{font-weight:600;overflow-wrap:anywhere;font-size:14px}
.row .d{font-size:12px;color:var(--mute);margin-top:3px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--tint);color:var(--p);white-space:nowrap}
.tag.o{background:#FDF0DC;color:#A8650B}.tag.g{background:#E3F5EC;color:#1F7A4F}.tag.r{background:#FBE5E4;color:#A33A36}
.bars{display:flex;align-items:flex-end;gap:4px;height:74px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{width:100%;background:var(--p2);border-radius:5px 5px 2px 2px;min-height:3px}
.bars div.today i{background:var(--acc)}
.bars em{font-style:normal;font-size:10px;color:var(--mute);margin-bottom:2px}
.bx{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:5px}
.tr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;font-size:11px;color:var(--mute);padding:6px 0 5px;text-decoration:none;border-radius:12px}
nav a.on{color:var(--p);background:var(--tint);font-weight:600}
nav svg{display:block;margin:0 auto 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--card);margin-bottom:10px;outline:none}
input:focus{border-color:var(--p2)}
.pre{white-space:pre-wrap;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.empty{color:var(--mute);font-size:13px;padding:4px 0}
.load{padding:48px 0;text-align:center;color:var(--mute)}
.spin{width:26px;height:26px;border:3px solid var(--tint);border-top-color:var(--p);border-radius:50%;margin:0 auto 10px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:6px 3px;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:11px;border-top:0}
td.z{color:#C9BFE3}
a.lk{color:var(--p);text-decoration:none;font-weight:600}
.more{display:block;text-align:center;color:var(--p);font-weight:600;font-size:14px;padding:8px 0 0}
.toast{position:fixed;left:14px;right:14px;bottom:84px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-size:14px;display:none;z-index:9;line-height:1.35}
</style></head><body>
<header><div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg></div>
<div><h1>Воронка аренд</h1><div class="sub">Kiwitaxi Chauffeur Hire · черновик</div></div></div>
<div class="health" id="hl"><span class="dot"></span><span>Проверяю…</span></div></header>
<main id="v"><div class="load"><div class="spin"></div>Загружаю…</div></main>
<nav id="nav">
<a data-t="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Главная</a>
<a data-t="day"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Отчёт за день</a>
<a data-t="log"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Журнал</a>
</nav>
<div class="toast" id="toast"></div>
<script>
var INIT='',TAB='home',DAY=0,LOGF='all',LOGQ='',LOGN=60,HOME=null,LOGD=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},4500)}
var API='https://script.google.com/macros/s/AKfycbwkIRHqhhzXl-NiKxOHZ92iWz5hedgJdfH-syR1sbMG8fO-_aOg8jV5Aa7QwHopBjMI/exec';
function call(a,arg){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({init:INIT,a:a,arg:arg==null?'':String(arg)})}).then(function(r){return r.json()}).then(function(d){if(d&&d.error)throw new Error(d.error);return d})}
function loading(){$('#v').innerHTML='<div class="load"><div class="spin"></div>Загружаю…</div>'}
function fail(e){$('#v').innerHTML='<div class="card"><div class="ct">Не получилось загрузить</div><div class="empty">'+esc(e&&e.message||e)+'</div></div>'}
function start(){
  try{var w=window.Telegram&&Telegram.WebApp;if(w){w.ready();w.expand();try{w.setHeaderColor('#5A2EC0');w.setBackgroundColor('#F6F3FB')}catch(e){}INIT=w.initData||''}}catch(e){}
  if(!INIT){$('#v').innerHTML='<div class="card"><div class="ct">Откройте из Telegram</div><div class="empty">Мини-апп работает только через кнопку «Воронка» в вашем боте.</div></div>';$('#hl').innerHTML='<span class="dot bad"></span><span>Нет доступа</span>';return}
  go('home');
}
document.querySelectorAll('nav a').forEach(function(a){a.onclick=function(){go(a.dataset.t)}});
function go(t){TAB=t;document.querySelectorAll('nav a').forEach(function(a){a.classList.toggle('on',a.dataset.t===t)});window.scrollTo(0,0);
  if(t==='home')loadHome();else if(t==='day')loadDay();else loadLog()}
function health(h){if(!h)return;$('#hl').innerHTML='<span class="dot '+h.level+'"></span><span>'+esc(h.text)+'</span>'}
function loadHome(){loading();call('home').then(function(d){HOME=d;health(d.health);if(TAB==='home')renderHome(d)}).catch(fail)}
function kpi(v,l,c){return '<div class="kpi'+(c?' '+c:'')+'"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'}
function fmtMin(m){return m>=120?Math.floor(m/60)+' ч '+(m%60)+' мин':m+' мин'}
function renderHome(d){
  var h='<div class="btns"><button class="b1" id="bRef">Обновить из Intercom</button><button class="b2" id="bUn">Без ответа → в бот</button></div>';
  h+='<div class="card"><div class="ct">Сегодня <small>'+esc(d.today.date)+'</small></div><div class="kpis">'+kpi(d.today.n,'новых заявок')+kpi(d.today.o,'офферов')+kpi(d.today.p,'оплат')+'</div></div>';
  h+='<div class="card"><div class="ct">7 дней</div><div class="kpis">'+kpi(d.week.n,'новых заявок')+kpi(d.week.o,'офферов')+kpi(d.week.p,'оплат')+'</div>';
  var mx=Math.max.apply(null,d.spark.map(function(x){return x.n}).concat([1]));
  h+='<div style="margin-top:14px;font-size:12px;color:var(--mute);margin-bottom:6px">Новые заявки по дням, 14 дней</div><div class="bars">'+d.spark.map(function(x,i){return '<div class="'+(i===d.spark.length-1?'today':'')+'"><em>'+(x.n||'')+'</em><i style="height:'+Math.round(x.n/mx*100)+'%"></i></div>'}).join('')+'</div><div class="bx"><span>'+esc(d.spark[0].d)+'</span><span>сегодня</span></div></div>';
  h+='<div class="card"><div class="ct">Без ответа клиенту <small>дольше 60 мин, без ADM</small></div>';
  h+=d.unans.length?'<div class="list">'+d.unans.map(function(x){return '<div class="row"><div class="m"><div class="n">'+esc(x.b)+'</div><div class="d">'+esc(x.ch)+(x.link?' · <a class="lk" href="'+esc(x.link)+'" target="_blank">Intercom</a>':'')+'</div></div><span class="tag o">'+fmtMin(x.mins)+'</span></div>'}).join('')+'</div>':'<div class="empty">Всё отвечено 👍</div>';
  h+='</div>';
  h+='<div class="card"><div class="ct">К переносу в воронку <small>'+esc(d.transfer.at)+'</small></div><div class="tr">'+kpi(d.transfer.n,'новых','o')+kpi(d.transfer.c,'изменились')+kpi(d.transfer.k,'проверить')+'</div></div>';
  h+='<div class="card"><div class="ct">Отчёт проверки <small>'+esc(d.report.at||'')+'</small></div>'+(d.report.text?'<div class="pre">'+esc(d.report.text)+'</div>':'<div class="empty">Первый отчёт придёт в 8:00</div>')+'</div>';
  if(d.errors)h+='<div class="card"><div class="ct">Ошибки загрузки за сутки <span class="tag r">'+d.errors+'</span></div><div class="empty">Подробности — в «Журнале», фильтр «Ошибки».</div></div>';
  $('#v').innerHTML=h;
  $('#bRef').onclick=function(){var b=this;b.disabled=true;b.textContent='Обновляю… до 4 мин';call('refresh').then(function(d){HOME=d;health(d.health);toast(d.msg||'Обновлено');if(TAB==='home')renderHome(d)}).catch(function(e){b.disabled=false;b.textContent='Обновить из Intercom';toast('Ошибка: '+(e.message||e))})};
  $('#bUn').onclick=function(){var b=this;b.disabled=true;b.textContent='Проверяю в Intercom…';call('unanswered').then(function(r){b.disabled=false;b.textContent='Без ответа → в бот';toast(r.msg)}).catch(function(e){b.disabled=false;b.textContent='Без ответа → в бот';toast('Ошибка: '+(e.message||e))})};
}
function loadDay(){loading();call('day',DAY).then(function(d){health(d.health);if(TAB==='day')renderDay(d)}).catch(fail)}
function renderDay(d){
  var h='<div class="chips">'+d.dates.map(function(x,i){return '<a class="chip'+(i===DAY?' on':'')+'" data-i="'+i+'">'+esc(x)+'</a>'}).join('')+'</div>';
  h+='<div class="card"><div class="ct">'+esc(d.title)+'</div><div class="kpis">'+d.kpi.map(function(k){return kpi(k[1],k[0])}).join('')+'</div></div>';
  h+='<div class="card"><div class="ct">События <small>'+d.events.length+'</small></div>';
  h+=d.events.length?'<div class="list">'+d.events.map(evRow).join('')+'</div>':'<div class="empty">Изменений нет</div>';
  h+='</div><div class="card"><div class="ct">По дням, 30 дней</div><table><tr><th>Дата</th><th>Заявки</th><th>Офферы</th><th>Оплаты</th><th>Отмены</th><th>Пуши</th></tr>'+d.table.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i&&!+c?' class="z"':'')+'>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
  $('#v').innerHTML=h;
  document.querySelectorAll('.chip[data-i]').forEach(function(c){c.onclick=function(){DAY=+c.dataset.i;loadDay()}});
}
var EVC={'новая заявка':'g','оплата':'g','поездка выполнена':'g','оффер':'','отмена':'r','ошибка загрузки':'r','смена статуса':'o'};
function evRow(r){var c=EVC[r.e];return '<div class="row"><div class="t">'+esc(r.t)+'</div><div class="m"><div class="n">'+esc(r.b||r.id)+'</div><div class="d">'+(r.f?esc(r.f)+': ':'')+(r.was?esc(r.was)+' → ':'')+esc(r.now||'')+'</div></div><span class="tag'+(c?' '+c:'')+'">'+esc(r.e)+'</span></div>'}
var LF=[['all','Все'],['new','Новые'],['offer','Офферы'],['pay','Оплаты'],['cancel','Отмены'],['status','Статусы'],['err','Ошибки']];
function loadLog(){loading();call('log',JSON.stringify({f:LOGF,q:LOGQ})).then(function(d){health(d.health);LOGD=d;LOGN=60;if(TAB==='log')renderLog()}).catch(fail)}
function renderLog(){var d=LOGD;
  var h='<div class="chips">'+LF.map(function(x){return '<a class="chip'+(x[0]===LOGF?' on':'')+'" data-f="'+x[0]+'">'+x[1]+'</a>'}).join('')+'</div>';
  h+='<input id="q" placeholder="Поиск: заявка, тикет, город" value="'+esc(LOGQ)+'">';
  h+='<div class="card"><div class="ct">Журнал <small>'+d.total+' событий</small></div>';
  var days={},list=d.rows.slice(0,LOGN),out='';
  list.forEach(function(r){if(!days[r.day]){days[r.day]=1;out+='<div style="font-size:12px;font-weight:600;color:var(--p);padding:10px 0 2px">'+esc(r.day)+'</div>'}out+=evRow(r)});
  h+=list.length?'<div class="list">'+out+'</div>':'<div class="empty">Ничего не найдено</div>';
  if(d.rows.length>LOGN)h+='<a class="more" id="more">Показать ещё</a>';
  h+='</div>';$('#v').innerHTML=h;
  document.querySelectorAll('.chip[data-f]').forEach(function(c){c.onclick=function(){LOGF=c.dataset.f;loadLog()}});
  var q=$('#q');q.onkeydown=function(e){if(e.key==='Enter'){LOGQ=q.value.trim();q.blur();loadLog()}};
  var m=$('#more');if(m)m.onclick=function(){LOGN+=60;renderLog()};
}
start();
</script></body></html>
